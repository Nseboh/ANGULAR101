<div class="container">
  <div class="row mt-5 justify-content-center">

    <div class="col-8 bg-light border shadow-lg">
      <form (ngSubmit)="submitFormInfor()" #userForm="ngForm">
        <!-- Name -->
        <div>
          <label for="name">Name: </label>
          <input type="text" id="name" name="name" class="form-control" [(ngModel)]="userRegistrationForm.name" required>
        </div>
        <!-- Age -->
        <div>
          <label for="age">Age: </label>
          <input type="number" id="age" class="form-control" name="age" [(ngModel)]="userRegistrationForm.age">
        </div>
        <!-- Email -->
        <div>
          <label for="email">Email: </label>
          <input type="email" id="email" class="form-control" name="email" [(ngModel)]="userRegistrationForm.email" required>
        </div>
        <!-- Password -->
        <div>
          <label for="password">Password: </label>
          <input type="password" id="password" class="form-control" name="password" [(ngModel)]="userRegistrationForm.password" required>
        </div>
        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword">Confirm Password: </label>
          <input type="password" id="confirmPassword" class="form-control" name="confirmPassword" [(ngModel)]="userRegistrationForm.confirmPassword" required>
        </div>
        <!-- Number -->
        <div>
          <label for="number">Number: </label>
          <input type="text" id="number" class="form-control" name="number" [(ngModel)]="userRegistrationForm.number">
        </div>
      <!-- Gender -->
        <div>
          <label for="maleOrFemale">Gender: </label>
          <label>Male <input type="radio" class="form-check-input"  id="maleOrFemale" name="maleOrFemale" value="male" [(ngModel)]="userRegistrationForm.maleOrFemale">
          </label>
          <label>Female <input type="radio" id="maleOrFemale" class="form-check-input" name="maleOrFemale" value="female" [(ngModel)]="userRegistrationForm.maleOrFemale">
          </label>
        </div>

        <!-- Date Of Birth -->
        <div>
          <label for="dateOfBirth">Date of Birth: </label>
          <input type="date" id="dateOfBirth" class="form-control" name="dateOfBirth" [(ngModel)]="userRegistrationForm.DateOfBirth">

        </div>
        <!-- Reason for Registering -->
        <div>
          <label for="reasonForRegistering">Reason For Registering: </label>
          <Textarea id="reasonForRegistering" class="form-control" name="reasonForRegistering" [(ngModel)]="userRegistrationForm.reasonForRegistering"></Textarea>

        </div>
        <!-- Submit button -->
         <div class="col align-self-end">
          <button type="submit" class="btn btn-primary float-end m-2" [disabled]="userForm.form.invalid" >Submit</button>
         </div>


      </form>
    </div>


  </div>
</div>
